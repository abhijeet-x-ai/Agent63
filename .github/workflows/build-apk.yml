name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agent63-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Agent 63 v1.1.3 Production Release"
          RELEASE_NOTES="## Agent 63 v1.1.3 🚀

          Turn your Android phone into an autonomous AI-powered development workstation.

          ### Fixes in this release:
          - **Startup Crash Fix**: Database and workspace init moved off the main thread with loading UI; Room failures degrade to empty lists instead of crashing.
          - **CI Build Fix**: Pinned GitHub Actions to stable versions (checkout@v4, setup-java@v4, upload-artifact@v4).
          - **Keystore Stability**: Stable security-crypto, safe API 21 fallback without crashes.
          - **Navigation Safety**: Bottom tabs use default routes, no more literal {projectPath} args; icon null-safety.
          - **Database Reset Fix**: Reset clears Room singleton so restart starts fresh.
          - **Full Backward Compatibility**: Android 5.0 (API 21) through Android 15 (API 35/36).

          ### Direct Download:
          Download and install \`app-debug.apk\` directly on your Android device."

          # Upload to existing release or create new release using native GitHub CLI
          if gh release view v1.1.3 > /dev/null 2>&1; then
            echo "Release v1.1.3 exists, updating APK asset..."
            gh release delete-asset v1.1.3 app-debug.apk -y > /dev/null 2>&1 || true
            gh release upload v1.1.3 app/build/outputs/apk/debug/app-debug.apk --clobber || \
              gh release upload v1.1.3 app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Creating release v1.1.3..."
            gh release create v1.1.3 app/build/outputs/apk/debug/app-debug.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
