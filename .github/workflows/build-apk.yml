name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Agent63-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Agent 63 v1.1.0 Production Release"
          RELEASE_NOTES="## Agent 63 v1.1.0 🚀

          Turn your Android phone into an autonomous AI-powered development workstation.

          ### Included in this build:
          - **Phase 1–4**: Core architecture, local terminal, Alpine Linux PRoot runtime, and professional code editor.
          - **Phase 5–8**: AI provider system, autonomous agent & tool execution, security policy engine, MCP servers & custom skills.
          - **Phase 9**: Secure browser & live preview server with console interception and port management.
          - **Phase 10**: Full Git CLI integration, GitHub account manager (PAT auth), 27 agent Git tools, visual staging, diff viewer, and conflict resolver.
          - **Agent 63 Stability & Compatibility**: Resolved startup crashes, isolated subsystem initialization, added startup diagnostics, Keystore dual-path encryption, and verified Android 5.0 (API 21) through Android 15 compatibility.

          ### Direct Download:
          Download and install \`app-debug.apk\` directly on your Android device."

          # Upload to existing release or create new release using native GitHub CLI
          if gh release view v1.1.0 > /dev/null 2>&1; then
            echo "Release v1.1.0 exists, updating APK asset..."
            gh release delete-asset v1.1.0 app-debug.apk -y > /dev/null 2>&1 || true
            gh release upload v1.1.0 app/build/outputs/apk/debug/app-debug.apk --clobber || \
              gh release upload v1.1.0 app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Creating release v1.1.0..."
            gh release create v1.1.0 app/build/outputs/apk/debug/app-debug.apk \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
